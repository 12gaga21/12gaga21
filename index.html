<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fantasy Style RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="battle-screen">
            <div id="player-character" class="character">
                <img id="player-sprite" class="character-sprite" src="https://via.placeholder.com/96x96/008000/FFFFFF?text=Player" alt="Player Sprite">
                <div class="stats-bar">HP: <div class="bar" id="player-hp-bar"><span id="player-hp">100</span></div></div>
                <div class="stats-bar">MP: <div class="bar" id="player-mp-bar"><span id="player-mp">50</span></div></div>
                <div class="effect-container" id="player-effect-container"></div>
            </div>
            <div id="enemy-character" class="character">
                <img id="enemy-sprite" class="character-sprite" src="https://via.placeholder.com/96x96/FF0000/FFFFFF?text=Enemy" alt="Enemy Sprite">
                <div class="stats-bar">HP: <div class="bar" id="enemy-hp-bar"><span id="enemy-hp">80</span></div></div>
                <div class="stats-bar">MP: <div class="bar" id="enemy-mp-bar"><span id="enemy-mp">30</span></div></div>
                <div class="effect-container" id="enemy-effect-container"></div>
            </div>
        </div>
        <div id="message-log">
            <p>Битва начинается!</p>
        </div>
        <div id="actions-menu">
            <button id="attack-button">Атака</button>
            <button id="magic-button">Магия</button>
            <button id="defend-button">Защита</button>
        </div>
        <div id="magic-menu" class="hidden">
            <!-- Сюда будут добавляться заклинания -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
